# Token refresh buffer (seconds before expiry to trigger refresh)
elitewealth.token.refresh-buffer-seconds=60

# RestTemplate timeouts (milliseconds)
elitewealth.http.connect-timeout=10000
elitewealth.http.read-timeout=30000

# Server
server.port=8080
spring.application.name=VantageAPI

# H2 embedded database (persists recent client searches in memory)
spring.datasource.url=jdbc:h2:file:./data/vantage;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.vantage.elitewealth=DEBUG
